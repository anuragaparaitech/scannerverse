<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="svGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#svGradient)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="89" height="89" rx="24.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Scanner Corner Targets -->
  <path d="M 20 32 L 20 22 A 2 2 0 0 1 22 20 L 32 20" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 32 L 80 22 A 2 2 0 0 0 78 20 L 68 20" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 20 68 L 20 78 A 2 2 0 0 0 22 80 L 32 80" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 68 L 80 78 A 2 2 0 0 1 78 80 L 68 80" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>

  <!-- Location Pin Body -->
  <path d="M 50 22 C 38.5 22 30 30.5 30 42 C 30 55.5 46.5 73.5 48.6 75.8 C 49.3 76.5 50.7 76.5 51.4 75.8 C 53.5 73.5 70 55.5 70 42 C 70 30.5 61.5 22 50 22 Z" 
        fill="#ffffff" />

  <!-- Inner Pin Center Beacon -->
  <circle cx="50" cy="41" r="10" fill="url(#svGradient)" />
  <circle cx="50" cy="41" r="4.5" fill="#38bdf8" />

  <!-- Radar Pulse Ring -->
  <circle cx="50" cy="41" r="14.5" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" stroke-dasharray="2 3"/>
</svg>
