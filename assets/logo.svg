<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="pinShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="shieldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- 3D Diamond / Shield Facets -->
  <!-- Top Flat Edge -->
  <polygon points="45,26 75,26 60,38" fill="#7dd3fc"/>
  <!-- Top Left Facet -->
  <polygon points="24,48 45,26 60,38 38,60" fill="url(#shieldTop)"/>
  <!-- Top Right Facet -->
  <polygon points="75,26 96,48 82,60 60,38" fill="#0284c7"/>
  <!-- Left Side Facet -->
  <polygon points="24,48 38,60 38,82 24,70" fill="url(#shieldLeft)"/>
  <!-- Right Side Facet -->
  <polygon points="96,48 82,60 82,82 96,70" fill="url(#shieldRight)"/>
  <!-- Bottom Left Facet -->
  <polygon points="38,82 60,108 60,82" fill="#0284c7"/>
  <!-- Bottom Right Facet -->
  <polygon points="82,82 60,108 60,82" fill="#075985"/>

  <!-- Central Flat Base for QR -->
  <polygon points="38,38 82,38 82,82 38,82" fill="#0369a1" opacity="0.4"/>

  <!-- QR Code White Card Plate -->
  <rect x="36" y="37" width="48" height="48" rx="3" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.25))"/>

  <!-- QR Code Elements (High Contrast Crisp Vector) -->
  <!-- Finder Pattern: Top-Left -->
  <rect x="40" y="41" width="13" height="13" fill="#0f172a" rx="1"/>
  <rect x="43" y="44" width="7" height="7" fill="#ffffff" rx="0.5"/>
  <rect x="45" y="46" width="3" height="3" fill="#0f172a"/>

  <!-- Finder Pattern: Bottom-Left -->
  <rect x="40" y="68" width="13" height="13" fill="#0f172a" rx="1"/>
  <rect x="43" y="71" width="7" height="7" fill="#ffffff" rx="0.5"/>
  <rect x="45" y="73" width="3" height="3" fill="#0f172a"/>

  <!-- Finder Pattern: Inner-Right -->
  <rect x="67" y="64" width="11" height="11" fill="#0f172a" rx="1"/>
  <rect x="69" y="66" width="7" height="7" fill="#ffffff" rx="0.5"/>
  <rect x="71" y="68" width="3" height="3" fill="#0f172a"/>

  <!-- QR Data Modules / Pixels -->
  <rect x="56" y="41" width="4" height="4" fill="#0f172a"/>
  <rect x="62" y="41" width="3" height="4" fill="#0f172a"/>
  <rect x="56" y="47" width="4" height="4" fill="#0f172a"/>
  <rect x="62" y="47" width="5" height="3" fill="#0f172a"/>
  <rect x="40" y="57" width="4" height="3" fill="#0f172a"/>
  <rect x="46" y="57" width="5" height="3" fill="#0f172a"/>
  <rect x="53" y="53" width="4" height="5" fill="#0f172a"/>
  <rect x="59" y="53" width="5" height="3" fill="#0f172a"/>
  <rect x="55" y="60" width="3" height="4" fill="#0f172a"/>
  <rect x="60" y="58" width="5" height="4" fill="#0f172a"/>
  <rect x="55" y="67" width="4" height="3" fill="#0f172a"/>
  <rect x="61" y="67" width="4" height="4" fill="#0f172a"/>
  <rect x="55" y="73" width="4" height="4" fill="#0f172a"/>
  <rect x="61" y="74" width="4" height="4" fill="#0f172a"/>
  <rect x="74" y="57" width="4" height="5" fill="#0f172a"/>

  <!-- Top-Right Globe Pin (Iconic Anchor) -->
  <g filter="url(#pinShadow)">
    <!-- Pin Body (pointing towards QR) -->
    <path d="M 88 12 C 78.5 12 71 19.5 71 29 C 71 37.5 83.5 51.5 86.8 54.8 C 87.5 55.5 88.5 55.5 89.2 54.8 C 92.5 51.5 105 37.5 105 29 C 105 19.5 97.5 12 88 12 Z" 
          fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Globe Grid inside Pin -->
    <circle cx="88" cy="28" r="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Globe Equator -->
    <line x1="78" y1="28" x2="98" y2="28" stroke="#0369a1" stroke-width="1.3"/>
    <!-- Globe Meridian -->
    <line x1="88" y1="18" x2="88" y2="38" stroke="#0369a1" stroke-width="1.3"/>
    <!-- Longitude Ellipse -->
    <ellipse cx="88" cy="28" rx="5.2" ry="10" fill="none" stroke="#0369a1" stroke-width="1.2"/>
    <!-- Latitude Curves -->
    <path d="M 80 23.5 Q 88 26 96 23.5" fill="none" stroke="#0369a1" stroke-width="1.2"/>
    <path d="M 80 32.5 Q 88 30 96 32.5" fill="none" stroke="#0369a1" stroke-width="1.2"/>
  </g>
</svg>
